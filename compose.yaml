services:
  app:
    build: .
    image: ds4300-practical-01:latest
    working_dir: /project
    volumes:
      - .:/project
    # Run as your own user so files written to results/ are owned by you.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  lab:
    image: ds4300-practical-01:latest
    working_dir: /project
    volumes:
      - .:/project
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --ServerApp.root_dir=/project --IdentityProvider.token=
    ports:
      - "127.0.0.1:8888:8888"
